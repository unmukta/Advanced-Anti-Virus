<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DLP Enterprise - Audit Logs</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        .log-entry {
            border-left: 4px solid #6c757d;
            padding: 10px;
            margin-bottom: 10px;
            font-family: monospace;
            background-color: #f8f9fa;
            white-space: pre-wrap;
        }
        .system { border-left-color: #6f42c1; }
        .network { border-left-color: #0d6efd; }
        .process { border-left-color: #198754; }
        .test { border-left-color: #fd7e14; }
        .error { border-left-color: #dc3545; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">
                <i class="bi bi-shield-check"></i> DLP Enterprise
            </a>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="/overview">Overview</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="/audit-logs">Audit Logs</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container-fluid mt-4">
        <div class="row">
            <div class="col-12">
                <div class="card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h5 class="mb-0"><i class="bi bi-list-check"></i> Audit Logs</h5>
                        <div>
                            <button id="refreshBtn" class="btn btn-sm btn-primary">
                                <i class="bi bi-arrow-clockwise"></i> Refresh
                            </button>
                            <button id="clearBtn" class="btn btn-sm btn-danger ms-2">
                                <i class="bi bi-trash"></i> Clear Logs
                            </button>
                        </div>
                    </div>
                    <div class="card-body">
                        <div id="logStats" class="alert alert-info">
                            <strong>Audit Log Statistics:</strong> Loading...
                        </div>
                        <div id="logsContainer">
                            <div class="text-center text-muted">
                                <i class="bi bi-inbox" style="font-size: 3rem;"></i>
                                <p>No audit logs found. Logs will appear here as they are generated.</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Function to load audit logs
        async function loadAuditLogs() {
            try {
                const response = await fetch('/api/audit/logs');
                if (!response.ok) throw new Error('API request failed');
                
                const logs = await response.json();
                const container = document.getElementById('logsContainer');
                
                // Clear the container
                container.innerHTML = '';
                
                if (logs.length === 0) {
                    container.innerHTML = `
                        <div class="text-center text-muted">
                            <i class="bi bi-inbox" style="font-size: 3rem;"></i>
                            <p>No audit logs found.</p>
                        </div>
                    `;
                    return;
                }
                
                // Display logs in reverse chronological order (newest first)
                logs.reverse().forEach(log => {
                    const logElement = document.createElement('div');
                    logElement.className = `log-entry ${log.type}`;
                    
                    const timestamp = new Date(log.timestamp).toLocaleString();
                    let logContent = `<strong>${timestamp}</strong> [${log.type.toUpperCase()}]<br>`;
                    
                    if (typeof log.data === 'object') {
                        logContent += JSON.stringify(log.data, null, 2);
                    } else {
                        logContent += log.data;
                    }
                    
                    logElement.innerHTML = logContent;
                    container.appendChild(logElement);
                });
            } catch (error) {
                console.error('Error loading audit logs:', error);
                document.getElementById('logsContainer').innerHTML = 
                    '<div class="alert alert-danger">Failed to load audit logs: ' + error.message + '</div>';
            }
        }
        
        // Function to load log statistics
        async function loadLogStats() {
            try {
                const response = await fetch('/api/audit/stats');
                const stats = await response.json();
                
                const statsElement = document.getElementById('logStats');
                statsElement.innerHTML = `
                    <strong>Audit Log Statistics:</strong>
                    Total entries: ${stats.total_entries} |
                    ${Object.entries(stats.by_type).map(([type, count]) => `${type}: ${count}`).join(' | ')}
                    | Last updated: ${new Date(stats.last_updated).toLocaleTimeString()}
                `;
            } catch (error) {
                console.error('Error loading log stats:', error);
            }
        }
        
        // Function to clear logs
        async function clearLogs() {
            if (confirm('Are you sure you want to clear all audit logs? This action cannot be undone.')) {
                try {
                    const response = await fetch('/api/audit/logs', { method: 'DELETE' });
                    const result = await response.json();
                    
                    if (response.ok) {
                        alert('Audit logs cleared successfully.');
                        loadAuditLogs();
                        loadLogStats();
                    } else {
                        alert('Failed to clear audit logs: ' + (result.message || 'Unknown error'));
                    }
                } catch (error) {
                    console.error('Error clearing logs:', error);
                    alert('Failed to clear audit logs.');
                }
            }
        }
        
        // Set up event listeners
        document.getElementById('refreshBtn').addEventListener('click', () => {
            loadAuditLogs();
            loadLogStats();
        });
        
        document.getElementById('clearBtn').addEventListener('click', clearLogs);
        
        // Load logs on page load
        document.addEventListener('DOMContentLoaded', () => {
            loadAuditLogs();
            loadLogStats();
            
            // Auto-refresh every 10 seconds
            setInterval(() => {
                loadAuditLogs();
                loadLogStats();
            }, 10000);
        });
    </script>
</body>
</html>
